<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Slicer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="stage"></div>

<div id="brand">SLICER</div>

<label id="drop" for="fileInput">
  <strong>Drop or click</strong>
  <small>.glb · .gltf · .obj · .stl</small>
</label>
<input id="fileInput" type="file" accept=".glb,.gltf,.obj,.stl" />

<div id="status">Drop a 3D file to begin.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "tweakpane": "https://esm.sh/tweakpane@4.0.4",
    "earcut": "https://esm.sh/earcut@2.2.4",
    "tone": "https://esm.sh/tone@14.7.77"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
